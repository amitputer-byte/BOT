<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Background circle -->
  <circle cx="96" cy="96" r="96" fill="#FFD93D"/>
  <!-- Fox ears -->
  <polygon points="40,90 55,40 75,82" fill="#FF8C42" stroke="#2D2D44" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="117,82 137,40 152,90" fill="#FF8C42" stroke="#2D2D44" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="47,84 57,52 69,80" fill="#FFB8A0"/>
  <polygon points="123,80 135,52 145,84" fill="#FFB8A0"/>
  <!-- Head -->
  <ellipse cx="96" cy="112" rx="50" ry="44" fill="#FF8C42" stroke="#2D2D44" stroke-width="3"/>
  <!-- Face white area -->
  <ellipse cx="96" cy="123" rx="30" ry="22" fill="#FFF0E0" stroke="#2D2D44" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="80" cy="108" r="7" fill="white" stroke="#2D2D44" stroke-width="2.5"/>
  <circle cx="112" cy="108" r="7" fill="white" stroke="#2D2D44" stroke-width="2.5"/>
  <circle cx="81" cy="109" r="4" fill="#2D2D44"/>
  <circle cx="113" cy="109" r="4" fill="#2D2D44"/>
  <circle cx="82" cy="107" r="1.5" fill="white"/>
  <circle cx="114" cy="107" r="1.5" fill="white"/>
  <!-- Nose -->
  <ellipse cx="96" cy="118" rx="5" ry="3.5" fill="#2D2D44"/>
  <!-- Smile -->
  <path d="M82 127 Q96 138 110 127" stroke="#2D2D44" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Cheek blush -->
  <ellipse cx="68" cy="118" rx="8" ry="5" fill="#FF6B9D" opacity="0.5"/>
  <ellipse cx="124" cy="118" rx="8" ry="5" fill="#FF6B9D" opacity="0.5"/>
  <!-- Hebrew letter כ (Kaf) in bold -->
  <text x="96" y="78" font-size="26" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" fill="#2D2D44">כ</text>
</svg>
